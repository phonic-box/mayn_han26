<script>
(function () {
  'use strict';

  var L = SongLogic;
  var AUTO_REFRESH_MS = 60 * 1000;

  var state = {
    shows: [],
    songs: [],
    setlists: {},       // show_id -> 曲順に並べたセットリスト
    warnings: [],
    selection: L.ALL,
    query: '',
    filter: 'performed',  // 全公演の初期表示は「披露済み」で絞り込み
    loading: false,
    loadedAt: 0
  };

  var $ = function (id) { return document.getElementById(id); };
  var els = {
    select: $('show-select'),
    reload: $('reload'),
    search: $('search'),
    filter: $('filter'),
    hint: $('mode-hint'),
    status: $('status'),
    warnings: $('warnings'),
    warningList: $('warning-list'),
    list: $('song-list'),
    empty: $('empty')
  };

  // google.script.run を Promise 化
  function callServer(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });
  }

  function errorMessage(err) {
    var msg = (err && err.message) || String(err || '');
    return msg.replace(/^Exception:\s*/, '') || '通信に失敗しました。';
  }

  // -------------------------------------------------------------------------
  // データ読み込み
  // -------------------------------------------------------------------------

  function load() {
    if (state.loading) return;
    state.loading = true;
    els.reload.disabled = true;
    showStatus(state.songs.length ? '最新のデータを読み込み中…' : '読み込み中…');

    callServer('getInitialData')
      .then(function (data) {
        state.shows = data.shows;
        state.songs = data.songs;
        state.setlists = data.setlists;
        state.warnings = data.warnings;
        state.loadedAt = Date.now();
        if (L.isShowSelection(state.selection) && !findShow(state.selection)) {
          state.selection = L.ALL;
        }
        hideStatus();
        renderSelect();
        render();
      })
      .catch(function (err) {
        showStatus('データを読み込めませんでした：' + errorMessage(err) + '　↻ で再読み込みしてください。', true);
      })
      .then(function () {
        state.loading = false;
        els.reload.disabled = false;
      });
  }

  function findShow(showId) {
    for (var i = 0; i < state.shows.length; i++) {
      if (state.shows[i].show_id === showId) return state.shows[i];
    }
    return null;
  }

  function showLabel(show) {
    return show.show_date ? show.show_name + '（' + show.show_date + '）' : show.show_name;
  }

  // -------------------------------------------------------------------------
  // 描画
  // -------------------------------------------------------------------------

  function renderSelect() {
    var select = els.select;
    select.textContent = '';
    select.appendChild(new Option('全公演', L.ALL));
    var group = document.createElement('optgroup');
    group.label = 'セットリストを見る';
    state.shows.forEach(function (show) {
      group.appendChild(new Option(showLabel(show), show.show_id));
    });
    select.appendChild(group);
    select.value = state.selection;
    select.disabled = false;
  }

  function render() {
    var selection = state.selection;
    var isShow = L.isShowSelection(selection);
    var fragment = document.createDocumentFragment();
    var count;

    els.filter.hidden = isShow;
    if (isShow) {
      var setlist = state.setlists[selection] || [];
      var entries = L.filterSetlist(setlist, state.query);
      entries.forEach(function (entry) { fragment.appendChild(renderSetlistRow(entry)); });
      count = entries.length;
      els.hint.textContent = '「' + showLabel(findShow(selection)) + '」のセットリスト（' + setlist.length + ' 曲）';
      els.empty.textContent = setlist.length ? '該当する曲はありません。' : 'セットリストはまだ登録されていません。';
    } else {
      var view = L.buildView(state.songs, { selection: selection, query: state.query, filter: state.filter });
      view.items.forEach(function (song) { fragment.appendChild(renderSongRow(song)); });
      count = view.items.length;
      els.hint.textContent = '公演を選ぶと、その公演のセットリストを曲順で表示します。';
      els.empty.textContent = '該当する曲はありません。';
    }

    els.list.textContent = '';
    els.list.appendChild(fragment);
    els.empty.hidden = count > 0 || !state.loadedAt;
    renderWarnings();
  }

  /** シートの照合エラーは管理者向けに一覧の上へ出す */
  function renderWarnings() {
    els.warningList.textContent = '';
    state.warnings.forEach(function (message) {
      var li = document.createElement('li');
      li.textContent = message;
      els.warningList.appendChild(li);
    });
    els.warnings.hidden = state.warnings.length === 0;
  }

  /**
   * 曲名を描画する。引用符 ‘’“” は日本語フォントだと全角幅になるので、
   * lang="en" の span で包んで欧文フォントで表示させる（textContent のみ使用）。
   */
  function appendTitleText(el, text) {
    String(text).split(/([‘’“”])/).forEach(function (part, i) {
      if (!part) return;
      if (i % 2 === 0) {
        el.appendChild(document.createTextNode(part));
        return;
      }
      var quote = document.createElement('span');
      quote.className = 'quote';
      quote.lang = 'en';
      quote.textContent = part;
      el.appendChild(quote);
    });
  }

  function textBlock(song) {
    var box = document.createElement('span');
    box.className = 'text';
    var title = document.createElement('span');
    title.className = 'song-title';
    appendTitleText(title, song.title);
    box.appendChild(title);
    if (song.reading) {
      var reading = document.createElement('span');
      reading.className = 'song-reading';
      reading.textContent = song.reading;
      box.appendChild(reading);
    }
    return box;
  }

  function chip(text, className) {
    var el = document.createElement('span');
    el.className = 'chip' + (className ? ' ' + className : '');
    el.textContent = text;
    return el;
  }

  /** 全公演：曲ごとに披露済み／未披露と、歌われた公演名 */
  function renderSongRow(song) {
    var li = document.createElement('li');
    var row = document.createElement('div');
    row.className = 'row';
    var text = textBlock(song);

    if (song.performed_show_ids.length) {
      var chips = document.createElement('span');
      chips.className = 'shows';
      song.performed_show_ids.forEach(function (id) {
        var show = findShow(id);
        chips.appendChild(chip(show ? show.show_name : id));
      });
      text.appendChild(chips);
    }

    var performed = song.performed_show_ids.length > 0;
    var badge = document.createElement('span');
    badge.className = 'badge ' + (performed ? 'performed' : 'unperformed');
    badge.textContent = performed ? '披露済み' : '未披露';

    row.appendChild(text);
    row.appendChild(badge);
    li.appendChild(row);
    return li;
  }

  /** 個別公演：セットリストの 1 曲（曲順つき） */
  function renderSetlistRow(entry) {
    var li = document.createElement('li');
    var row = document.createElement('div');
    row.className = 'row';

    var no = document.createElement('span');
    no.className = 'setlist-no';
    no.textContent = entry.no || '–';

    var text = textBlock(entry);
    if (!entry.song_id) text.appendChild(chip('Songs に未登録', 'warn'));

    row.appendChild(no);
    row.appendChild(text);
    li.appendChild(row);
    return li;
  }

  function showStatus(message, isError) {
    els.status.textContent = message;
    els.status.classList.toggle('error', !!isError);
    els.status.hidden = false;
  }

  function hideStatus() {
    els.status.hidden = true;
  }

  // -------------------------------------------------------------------------
  // イベント
  // -------------------------------------------------------------------------

  els.select.addEventListener('change', function () {
    state.selection = els.select.value;
    render();
    window.scrollTo(0, 0);
  });

  els.search.addEventListener('input', function () {
    state.query = els.search.value;
    render();
  });

  els.filter.addEventListener('click', function (event) {
    var button = event.target.closest('button[data-filter]');
    if (!button) return;
    state.filter = button.dataset.filter;
    Array.prototype.forEach.call(els.filter.querySelectorAll('button'), function (b) {
      b.setAttribute('aria-pressed', String(b === button));
    });
    render();
  });

  els.reload.addEventListener('click', load);

  // スマホでアプリに戻ってきたとき、古いデータなら自動で読み直す
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - state.loadedAt > AUTO_REFRESH_MS) {
      load();
    }
  });

  load();
})();
</script>
